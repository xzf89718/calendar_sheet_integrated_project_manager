[pytest]
testpaths = .
# NOTE: this ini must stay pure ASCII. On Chinese Windows, pytest reads
# ini files with the locale codec (GBK), and any non-ASCII byte here
# crashes the whole run before collection starts. If you need Chinese
# notes, put them in tests/README.md, not here.
# The sandbox mount disallows hardlinks, which breaks pytest's cache;
# the cache is worthless for this project anyway, so disable it
# everywhere (harmless on Windows).
addopts = -p no:cacheprovider
